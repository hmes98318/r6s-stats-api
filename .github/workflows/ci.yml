name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
              env:
                  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
            - run: npm run check
            - run: npm pack --dry-run
