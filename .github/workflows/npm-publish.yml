name: Publish to npm

on:
    release:
        types: [created]

permissions:
    contents: read

env:
    PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  package-manager-cache: false
            - run: npm ci
            - run: npm run check

    publish-npm:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  registry-url: https://registry.npmjs.org/
                  package-manager-cache: false
            - run: npm ci
            - run: npm run check
            - run: npm publish
